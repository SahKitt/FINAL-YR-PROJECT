server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index login.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ========== AUTH + PUBLIC PAGES ==========
    location = /login {
        try_files $uri /login.html;
    }
    location = /register {
        try_files $uri /login.html;
    }

    # ========== ADMIN FRONTEND ==========
    location = /admin.html {
        try_files $uri /admin.html;
    }
    location ~ ^/admin/(overview|data|ml-correlation|reports|user-management|sys-health)$ {
        try_files $uri /admin.html;
    }

    # ========== USER DASHBOARD ==========
    location = /dashboard.html {
        try_files $uri /dashboard.html;
    }
    location ~ ^/dashboard/(overview|analytics|reports|controls|support)$ {
        try_files $uri /dashboard.html;
    }

    # ========== ADMIN API ENDPOINTS ==========
    location = /admin/stats/overview {
        proxy_pass http://dashboard-backend:8001/dashboard/admin/stats/overview;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/data/ {
        proxy_pass http://dashboard-backend:8001/dashboard/admin/data/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/reports/ {
        proxy_pass http://dashboard-backend:8001/dashboard/admin/reports/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/users {
        proxy_pass http://dashboard-backend:8001/dashboard/admin/users;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /admin/syshealth {
        proxy_pass http://dashboard-backend:8001/dashboard/admin/syshealth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/loadtest/ {
        proxy_pass http://dashboard-backend:8001/dashboard/admin/loadtest/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ai/ {
        proxy_pass http://dashboard-backend:8001/dashboard/admin/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========  ADMIN AUDIT LOGS ==========
    location = /admin/audit-logs {
        proxy_pass http://dashboard-backend:8001/dashboard/admin/audit-logs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========== USER DASHBOARD API ENDPOINTS ==========
    location ~ ^/dashboard/(stats|transactions|reports/|controls/|ruled-transactions|processed-transactions) {
        proxy_pass http://dashboard-backend:8001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========== AUTH API ENDPOINTS ==========
    location /auth/ {
        proxy_pass http://dashboard-backend:8001/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========== CATCH-ALL ==========
    # For any other path, try the file, then fall back to login.html
    location / {
        try_files $uri $uri/ /login.html;
    }
}