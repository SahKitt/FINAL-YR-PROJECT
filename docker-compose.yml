services:

  #mongoDb service
  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=transactions_db
    volumes:
      - mongodb_data:/data/db
      - ./mongodb:/docker-entrypoint-initdb.d:ro
    command: mongod --bind_ip_all --quiet --logpath /dev/null
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - fraud-net
      
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - fraud-net

  # Kafka broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test: ["CMD", "kafka-topics", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fraud-net

  # Kafka topic initializer
  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/bash
    command: >
      -c "
      echo 'Waiting for Kafka to be ready...' &&
      sleep 30 &&
      echo 'Creating topics...' &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9093 --topic transactions_topic --partitions 10 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9093 --topic bad_records_topic --partitions 5 --replication-factor 1 &&
      echo 'Topics created successfully' &&
      kafka-topics --list --bootstrap-server kafka:9093
      "
    networks:
      - fraud-net

  # Redis for idempotency
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass Blackbutler@212
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fraud-net

  # Transaction Ingestion API
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - REDIS_HOST=redis
      - REDIS_PASSWORD=Blackbutler@212
      - MONGO_URI=mongodb://host.docker.internal:27017/
      - MONGO_DATABASE=transactions_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    env_file:
      - .env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api/src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://0.0.0.0:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - fraud-net

  # Transaction Consumer
  consumer:
    build: ./consumer
    deploy:
      replicas: 5
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - KAFKA_GROUP_ID=transaction-consumers
      - MONGO_URI=mongodb://host.docker.internal:27017/
      - MONGO_DATABASE=transactions_db
      - BATCH_SIZE=100
      - MAX_POLL_RECORDS=500
      - METRICS_PORT=9091
      - KAFKA_TRANSACTIONS_TOPIC=transactions_topic
      - KAFKA_BAD_RECORDS_TOPIC=bad_records_topic
      - KAFKA_ALLOW_AUTO_CREATE_TOPICS= false
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      kafka-init:
        condition: service_completed_successfully 
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./consumer/src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect(('kafka', 9092)); s.close()"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 50s
    restart: unless-stopped
    networks:
      - fraud-net

  rule-engine:
    build: ./rule_engine
    ports:
      - "9095:9092"  
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/
      - MONGO_DATABASE=transactions_db
      - REDIS_HOST=redis
      - REDIS_PASSWORD=Blackbutler@212
      - RULE_ENGINE_WORKERS=10
      - PROCESSING_BATCH_SIZE=1000
      - METRICS_PORT=9092
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      consumer:
        condition: service_healthy
    volumes:
      - ./rule_engine:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',9092)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - fraud-net

# Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - api
      - consumer
    networks:
      - fraud-net

  dashboard-backend:
    build: ./dashboard/backend
    ports:
      - "8001:8001"
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET_KEY}
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./dashboard/backend:/app   
    restart: unless-stopped
    networks:
      - fraud-net
  
  dashboard-frontend:
    build: ./dashboard/front
    ports:
      - "3000:80"
    depends_on:
      - dashboard-backend
    restart: unless-stopped
    networks: 
      - fraud-net

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/Blackbutler@212
      - NEO4J_server_memory_heap_max__size=512m   
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "Blackbutler@212", "MATCH (n) RETURN count(n)"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - fraud-net

  ml-engine:
    build: ./ml-engine
    environment:
      - ML_METRICS_PORT=9093 
      - MONGO_URI=mongodb://host.docker.internal:27017/
      - MONGO_DATABASE=transactions_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=Blackbutler@212
      - RETRAIN_INTERVAL_HOURS=4
      - PYTHONUNBUFFERED=1  
    volumes:
      - ./ml-engine/models:/app/models  
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      rule-engine:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',9093)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - fraud-net

networks:
  fraud-net:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  prometheus_data:
  neo4j_data:
  neo4j_logs: